[package]
name = "nexus-registry"
version = "1.0.0"
edition = "2021"
publish = false
description = "Source of truth for Nexus remote configuration"

[[bin]]
name = "nexus-registry"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
hyper = "1.10.1"

sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
rand = "0.10.1"
hex = "0.4"
thiserror = "2.0.18"
futures-util = "0.3"

reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Runtime-configurable platform features
governor = "0.10"
prometheus = { version = "0.14", default-features = false }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
async-trait = "0.1"
ulid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
